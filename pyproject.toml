[project]
name = "appanalyse"
version = "0.1.0"
description = "ADB-basierte Analyse installierter Android-Apps zum Aufspueren versteckter oder selbst gebauter Chat-Apps"
requires-python = ">=3.10"
license = "MIT"
keywords = ["android","forensics","adb","stalkerware","security"]
dependencies = [
    "androguard>=4.1,<5",
    "requests>=2.31",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "websockets>=12.0",
]

[project.scripts]
appanalyse = "appanalyse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appanalyse = ["data/*.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Projektlokales Temp-Verzeichnis: umgeht ACL-Probleme mit dem globalen
# pytest-of-<user>-Ordner unter Windows.
addopts = "--basetemp=.pytest_tmp"
